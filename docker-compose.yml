# Rent2Cool – lokale Entwicklungsumgebung (D-005).
#
# Ein Befehl startet alles:   pnpm stack:up   (== docker compose up -d)
#
# Jeder Dienst bietet nur Standard-Schnittstellen (PostgreSQL, Kafka-API,
# S3-API, OpenID Connect). In der Cloud wird jeder Dienst durch einen
# verwalteten Gegenpart mit derselben Schnittstelle ersetzt – nur die
# Verbindungs-URLs in der .env ändern sich, kein Code.
#
# Daten liegen in benannten Volumes; nichts hängt an lokalen Pfaden.

name: rent2cool

services:
  # --- PostgreSQL mit TimescaleDB (Messreihen: Partitionierung/Kompression) ---
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rent2cool}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rent2cool_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-rent2cool}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-rent2cool} -d ${POSTGRES_DB:-rent2cool}']
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Warteschlange: Redpanda (Kafka-API-kompatibel) ---
  redpanda:
    image: redpandadata/redpanda:v24.2.9
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:19092
    ports:
      - '19092:19092'
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ['CMD-SHELL', "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Hintergrundjobs: Valkey (Redis-kompatibel, für BullMQ) ---
  valkey:
    image: valkey/valkey:8.0.1-alpine
    command: ['valkey-server', '--save', '', '--appendonly', 'no']
    ports:
      - '6379:6379'
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Objektspeicher: S3-API (lokal SeaweedFS, Vorschlag D-019) ---
  # MinIO stellt keine Community-Images mehr bereit; SeaweedFS spricht dieselbe
  # S3-API. Zugangsdaten nur lokale Platzhalter aus der .env (D-015).
  objektspeicher:
    image: chrislusf/seaweedfs:3.80
    entrypoint: >
      /bin/sh -c "
      printf '{\"identities\":[{\"name\":\"rent2cool\",\"credentials\":[{\"accessKey\":\"%s\",\"secretKey\":\"%s\"}],\"actions\":[\"Admin\",\"Read\",\"Write\",\"List\",\"Tagging\"]}]}' \"$$S3_ACCESS_KEY\" \"$$S3_SECRET_KEY\" > /tmp/s3.json &&
      exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json"
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rent2cool_local}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-rent2cool_local_secret}
    ports:
      - '8333:8333'
    volumes:
      - objektspeicher-data:/data
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:8333/healthz']
      interval: 5s
      timeout: 5s
      retries: 20

  # Legt beim Start den lokalen Bucket an.
  objektspeicher-setup:
    image: chrislusf/seaweedfs:3.80
    depends_on:
      objektspeicher:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo 's3.bucket.create -name ${S3_BUCKET:-rent2cool-local}' | weed shell -master=objektspeicher:9333 &&
      echo 'Bucket bereit'"
    restart: 'no'

  # --- Anmeldung und Rollen: Keycloak (OpenID Connect) ---
  keycloak:
    # Offizielles Keycloak-Image über Docker Hub (identisch mit quay.io;
    # quay.io ist nicht aus jeder Umgebung erreichbar).
    image: keycloak/keycloak:26.0.5
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_local_dev}
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '8080:8080'
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'",
        ]
      interval: 15s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
  redpanda-data:
  valkey-data:
  objektspeicher-data:
