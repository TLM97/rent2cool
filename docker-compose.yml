# Rent2Cool – lokale Entwicklungsumgebung (D-005).
#
# Ein Befehl startet alles:   pnpm stack:up   (== docker compose up -d)
#
# Jeder Dienst bietet nur Standard-Schnittstellen (PostgreSQL, Kafka-API,
# S3-API, OpenID Connect). In der Cloud wird jeder Dienst durch einen
# verwalteten Gegenpart mit derselben Schnittstelle ersetzt – nur die
# Verbindungs-URLs in der .env ändern sich, kein Code.
#
# Daten liegen in benannten Volumes; nichts hängt an lokalen Pfaden.

name: rent2cool

services:
  # --- PostgreSQL mit TimescaleDB (Messreihen: Partitionierung/Kompression) ---
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rent2cool}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rent2cool_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-rent2cool}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rent2cool} -d ${POSTGRES_DB:-rent2cool}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Warteschlange: Redpanda (Kafka-API-kompatibel) ---
  redpanda:
    image: redpandadata/redpanda:v24.2.9
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:19092
    ports:
      - "19092:19092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Hintergrundjobs: Valkey (Redis-kompatibel, für BullMQ) ---
  valkey:
    image: valkey/valkey:8.0.1-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Objektspeicher: MinIO (S3-API) ---
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-rent2cool_local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-rent2cool_local_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Legt beim Start den lokalen Bucket an.
  minio-setup:
    image: minio/mc:RELEASE.2024-11-05T11-29-45Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-rent2cool_local} ${S3_SECRET_KEY:-rent2cool_local_secret} &&
      mc mb --ignore-existing local/${S3_BUCKET:-rent2cool-local} &&
      echo 'MinIO-Bucket bereit' "
    restart: "no"

  # --- Anmeldung und Rollen: Keycloak (OpenID Connect) ---
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.5
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_local_dev}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'",
        ]
      interval: 15s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
  redpanda-data:
  valkey-data:
  minio-data:
