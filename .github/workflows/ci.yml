name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Format, Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: pnpm installieren
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Formatierung
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      # Prüft auch die Testdateien (tsconfig.test.json je Paket).
      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

  integration:
    name: Integrationstests (PostgreSQL + TimescaleDB, S3, Valkey, Mail)
    runs-on: ubuntu-latest
    services:
      postgres:
        # Gleiches Image wie docker-compose.yml.
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: rent2cool
          POSTGRES_PASSWORD: rent2cool_local_dev
          POSTGRES_DB: rent2cool
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rent2cool"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      valkey:
        # Gleiches Image wie docker-compose.yml (Hintergrundjobs, BullMQ).
        image: valkey/valkey:8.0.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mail:
        # Mailpit wie in docker-compose.yml: fängt Mails ab, Prüfung über die API.
        image: axllent/mailpit:v1.21.8
        ports:
          - 1025:1025
          - 8025:8025
    env:
      # Nur ein Wegwerf-Container der CI; die Tests nutzen daraus rent2cool_test.
      DATABASE_URL: postgres://rent2cool:rent2cool_local_dev@localhost:5432/rent2cool
    steps:
      - uses: actions/checkout@v4

      - name: pnpm installieren
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Gemeinsames Paket bauen
        run: pnpm --filter @rent2cool/shared build

      # Objektspeicher (S3-API) wie lokal aus docker-compose.yml – SeaweedFS
      # mit Platzhalter-Zugangsdaten, Bucket per Setup-Container.
      - name: Objektspeicher starten
        run: |
          melde() {
            # Bei Fehler: Container-Logs als Annotation (in der Run-Übersicht lesbar).
            log=$(docker compose ps -a 2>&1; docker compose logs --tail 40 objektspeicher 2>&1)
            echo "::error title=Objektspeicher::${log//$'\n'/%0A}"
            exit 1
          }
          docker compose up -d --wait --wait-timeout 180 objektspeicher || melde
          docker compose run --rm objektspeicher-setup || melde

      - name: Integrationstests Kern
        run: >-
          pnpm --filter @rent2cool/core test:integration
          --reporter=default --reporter=json --outputFile=integration-ergebnis.json

      # Schutz gegen stilles Überspringen (describe.skipIf): kein Test darf
      # ausgelassen sein, und es müssen tatsächlich Integrationstests gelaufen sein.
      - name: Keine übersprungenen Tests
        run: |
          jq '{numTotalTests, numPassedTests, numFailedTests, numPendingTests}' apps/core/integration-ergebnis.json
          jq -e '.numPendingTests == 0 and .numFailedTests == 0 and .numPassedTests > 50' apps/core/integration-ergebnis.json
